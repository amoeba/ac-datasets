name: Publish Datasets

on:
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - ".github/workflows/publish-datasets.yml"

permissions:
  contents: write

jobs:
  detect-dataset-changes:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Detect release-worthy dataset changes
        id: detect
        run: |
          if git diff --quiet "${{ github.event.before }}" "$GITHUB_SHA" -- .github/workflows/publish-datasets.yml; then
            should_publish="$(uv run scripts/dataset_release_needed.py "${{ github.event.before }}" "$GITHUB_SHA")"
          else
            should_publish=true
          fi
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-dataset-changes
    if: needs.detect-dataset-changes.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Validate data packages
        run: |
          for dir in datasets/*/; do
            uv run scripts/generate_datapackage.py "$dir" --check
          done
          uv run scripts/validate_datapackages.py
          uv run pytest

      - name: Build databases
        run: |
          find datasets -mindepth 2 -maxdepth 2 -type f -name '*.csv' -print0 |
            while IFS= read -r -d '' csv; do
              database="$(basename "$(dirname "$csv")")"
              uv run csvs-to-sqlite "$csv" "$database.db"
            done
          find . -maxdepth 1 -type f -name '*.db' -printf '%f\n' | sort > databases.txt
          test -s databases.txt

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="datasets-${GITHUB_SHA}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" ./*.db databases.txt \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --generate-notes
          fi

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest --json assets --jq '.assets[].name' >/tmp/latest-assets; then
            while IFS= read -r asset; do
              case "$asset" in
                *.db|databases.txt) gh release delete-asset latest "$asset" --yes ;;
              esac
            done </tmp/latest-assets
            gh release upload latest ./*.db databases.txt
          else
            gh release create latest ./*.db databases.txt \
              --target "$GITHUB_SHA" \
              --title Latest \
              --notes "Current dataset deployment."
          fi

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add Dokku host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.DOKKU_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        run: |
          git remote add dokku "dokku@${{ vars.DOKKU_HOST }}:${{ vars.DOKKU_APP }}"
          git push dokku HEAD:main
